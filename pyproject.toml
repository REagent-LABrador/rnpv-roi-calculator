[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "labrador-roi"
version = "0.4.0"
description = "Interpretable therapeutic program economics from comparable prices to protected cash flow."
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [{ name = "LABrador contributors" }]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "plotly>=5.24,<7",
  "pydantic>=2.8,<3",
  "pyyaml>=6,<7",
  "rich>=13.7,<15",
  "streamlit>=1.41,<2",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "jsonschema>=4.23,<5",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.8,<1",
]

[project.scripts]
labrador = "labrador_roi.cli:app"
rnpv-roi = "labrador_roi.module_runner:app"

[tool.hatch.build.targets.wheel]
packages = ["src/labrador_roi"]

[tool.hatch.build.targets.wheel.force-include]
"examples" = "labrador_roi/examples"
"fixtures" = "labrador_roi/fixtures"
"schemas" = "labrador_roi/schemas"

[tool.hatch.build.targets.sdist]
include = [
  "/README.md",
  "/examples",
  "/scripts",
  "/schemas",
  "/pyproject.toml",
  "/src/labrador_roi",
  "/fixtures",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
